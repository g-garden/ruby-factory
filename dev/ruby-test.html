<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruby ランタイム検証</title>
<style>
  :root { --bg: #14161a; --fg: #e8e6e3; --muted: #9aa0a6; --ok: #3ccf7a; --ng: #ff5470; --line: #2a2e35; --accent: #e0115f; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 20px 0 6px; color: var(--accent); }
  #status { color: var(--muted); font-family: ui-monospace, monospace; }
  table { border-collapse: collapse; width: 100%; }
  td, th { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
  td.r { font-weight: 700; width: 3em; }
  td.ok { color: var(--ok); } td.ng { color: var(--ng); }
  td.d { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); white-space: pre-wrap; word-break: break-all; }
  #summary { font-weight: 700; }
</style>
</head>
<body>
<h1>Ruby ランタイム検証（src/ruby）</h1>
<div id="status">起動中…</div>
<div id="summary"></div>
<h2>チェック</h2>
<table><tbody id="checks"></tbody></table>
<h2>計測</h2>
<table><tbody id="measure"></tbody></table>
<script type="module">
import { RubyRuntime } from "../src/ruby/runtime.js";

const $ = (id) => document.getElementById(id);
const results = [];
const measures = {};
window.__results = results;
window.__measures = measures;
window.__done = false;

function row(tbody, cells) {
  const tr = document.createElement("tr");
  for (const [text, cls] of cells) {
    const td = document.createElement("td");
    td.textContent = text;
    if (cls) td.className = cls;
    tr.append(td);
  }
  $(tbody).append(tr);
}
function measure(key, value, note = "") {
  measures[key] = value;
  row("measure", [[key], [typeof value === "number" ? value.toFixed(1) : String(value), "d"], [note, "d"]]);
}
async function check(name, fn) {
  const t0 = performance.now();
  let ok = false, detail = "";
  try {
    detail = (await fn()) ?? "";
    ok = true;
  } catch (e) {
    detail = String(e && e.stack || e);
  }
  const ms = performance.now() - t0;
  results.push({ name, ok, detail: String(detail), ms });
  row("checks", [[ok ? "OK" : "NG", "r " + (ok ? "ok" : "ng")], [name], [`${ms.toFixed(0)}ms ${detail}`, "d"]]);
}
function assert(cond, msg) { if (!cond) throw new Error(msg || "assert"); }
const near = (a, b, tol, what) => assert(Math.abs(a - b) <= tol, `${what}: ${a} が ${b}±${tol} の外`);

// rng.js と同じ形のベルトを自前で作る
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const COLOR_IDX = { red: 0, blue: 1, green: 2 };
function makeBelt(seed, colors = ["red"]) {
  const r = mulberry32(seed);
  return Array.from({ length: 512 }, (_, id) => ({ id, color: colors[Math.floor(r() * colors.length)], carat: 1 + Math.floor(r() * 9), flaw: r() < 0.25 }));
}
const lit = (belt, box) => `[${box}, 200000, [${belt.map((o) => `[${o.id},${COLOR_IDX[o.color]},${o.carat},${o.flaw}]`).join(",")}]]`;
const bench = (box, colors) => [1, 2, 3].map((s) => lit(makeBelt(s, colors), box));
const perOre = (rs) => rs.reduce((a, r) => a + r.ops, 0) / rs.length / 512;

const STRAIGHTS_CHUNK = `
def straights(ores)
  pool = ores.group_by(&:carat)
  out = []
  loop do
    run = (1..9).filter_map { pool[it]&.pop }
    break if run.empty?
    out.concat run.chunk_while { |a, b| b.carat == a.carat + 1 }
                  .flat_map { it.each_slice(box).to_a }
  end
  out
end
`;
const STRAIGHTS_CONS = `
def straights(ores)
  pool = ores.group_by(&:carat)
  (1..9).each_cons(box).flat_map do |run|
    Array.new(run.map { pool[it]&.size.to_i }.min) { run.map { pool[it].pop } }
  end
end
`;
const PACK_STRAIGHT = "def pack(belt)\n  belt.reject(&:flaw).group_by(&:color).values.flat_map { straights(it) }\nend\n";
const PACK_POLISH = "def pack(belt)\n  belt.map { it.flaw ? it.polish : it }\n      .group_by(&:color).values.flat_map { straights(it) }\nend\n";
const EXAMPLES = [
  ["(1) 初期コード", 1, ["red"], "def pack(belt)\n  belt.map { [it] }\nend\n", 0, 0],
  ["(2) each_slice", 3, ["red"], "def pack(belt)\n  belt.each_slice(box).to_a\nend\n", 0, 0],
  ["(2) endless", 3, ["red"], "def pack(belt) = belt.each_slice(box).to_a\n", 0, 0],
  ["(3) reject", 3, ["red"], "def pack(belt)\n  belt.reject(&:flaw).each_slice(box).to_a\nend\n", 1, 0],
  ["(3) パターンマッチ", 3, ["red"], "def pack(belt)\n  belt.select { it in {flaw: false} }.each_slice(box).to_a\nend\n", 1, 0],
  ["(4) sort_by", 3, ["red"], "def pack(belt)\n  belt.reject(&:flaw).sort_by(&:carat).each_slice(box).to_a\nend\n", 1.74, 0.08],
  ["(4) sort { }", 3, ["red"], "def pack(belt)\n  belt.reject(&:flaw).sort { |a, b| a.carat <=> b.carat }.each_slice(box).to_a\nend\n", 6.96, 0.6],
  ["(5) group_by 箱3", 3, ["red", "blue"], "def pack(belt)\n  belt.reject(&:flaw)\n      .group_by(&:color)\n      .values\n      .flat_map { it.sort_by(&:carat).each_slice(box).to_a }\nend\n", 2.49, 0.08],
  ["(6) chunk_while", 5, ["red", "blue"], PACK_STRAIGHT + STRAIGHTS_CHUNK, 3.76, 0.25],
  ["(7) each_cons", 5, ["red", "blue"], PACK_STRAIGHT + STRAIGHTS_CONS, 2.49, 0.08],
  ["(8) 研磨 + each_cons", 5, ["red", "blue"], PACK_POLISH + STRAIGHTS_CONS, 5.05, 0.3],
  ["(8) 研磨 + chunk_while", 5, ["red", "blue"], PACK_POLISH + STRAIGHTS_CHUNK, 6.76, 0.4],
  ["(8) 研磨 箱9 3色", 9, ["red", "blue", "green"], PACK_POLISH + STRAIGHTS_CONS, null, 0],
  ["(9) puts / p", 3, ["red"], "def pack(belt)\n  puts belt.map(&:carat).tally.sort.to_h.inspect\n  p belt.first\n  belt.each_slice(box).to_a\nend\n", 1 + 3 / 512, 0.001],
];
const GOOD = "def pack(belt) = belt.each_slice(box).to_a\n";

const statusLog = [];
const rt = new RubyRuntime({
  onStatus: (s) => {
    statusLog.push({ t: performance.now(), ...s });
    $("status").textContent = s.phase === "download" ? `download ${(s.progress * 100).toFixed(0)}%` : `${s.phase} ${s.description || s.reason || s.message || ""}`;
  },
});
window.rt = rt;

const t0 = performance.now();
await check("ready（VM 起動）", async () => {
  const r = await rt.ready;
  assert(/^ruby 4\.0\.0 .*wasm32-wasi/.test(r.description), r.description);
  const prog = statusLog.filter((s) => s.phase === "download").map((s) => s.progress);
  assert(prog.every((p) => p >= 0 && p <= 1) && prog.at(-1) === 1, "progress が 0..1 で 1 に届く");
  assert(statusLog.some((s) => s.phase === "compile") && statusLog.some((s) => s.phase === "boot"), "phase");
  return `${r.description}  phases=${[...new Set(statusLog.map((s) => s.phase))].join(",")}`;
});
measure("ready までの合計 ms", performance.now() - t0);
measure("wasm ダウンロード ms", rt.timings.download, rt.timings.wasmUrl);
measure("wasm コンパイル ms（メモリ上限の書き込み込み）", rt.timings.compile);
measure("最初の Worker+VM+prelude ms", rt.timings.firstVm, `うち VM 作成（Worker 内）${rt.timings.vmInWorker.toFixed(1)}ms`);
measure("VM の wasm メモリ（仮想サイズ）MB", rt.prod.baseMem / 2 ** 20);
// ?mem: 起動直後（VM 1 つ、まだ一度も作り直していない）の RSS を外から取らせる
if (new URLSearchParams(location.search).has("mem")) {
  window.__memPoint = "boot";
  await new Promise((r) => setTimeout(r, 1500));
}

await check("デプロイ前の batch は NotDeployed", async () => {
  const r = await rt.batch(lit(makeBelt(1), 1));
  assert(!r.ok && r.errClass === "NotDeployed", JSON.stringify(r));
});

await check("初回デプロイ（oldResults は null）", async () => {
  const d = await rt.deploy(EXAMPLES[0][3], bench(1, ["red"]));
  assert(d.ok && d.oldResults === null && d.newResults.length === 3, JSON.stringify(d).slice(0, 200));
  return `deploy 全体 ${rt.timings.lastDeploy.total.toFixed(0)}ms（うち新 VM ${rt.timings.lastDeploy.vm.toFixed(0)}ms）`;
});
measure("デプロイ 1 回（新 VM 作成〜ベンチ 3 本〜昇格）ms", rt.timings.lastDeploy.total, `新 VM ${rt.timings.lastDeploy.vm.toFixed(1)}ms`);

// ?mem のときは 2 VM 同時保持のメモリだけを測る（ほかのチェックで太ったプロセスを測らないため）
const MEM_ONLY = new URLSearchParams(location.search).has("mem");
if (!MEM_ONLY) await suite();
await memCheck();
finish();

async function suite() {

for (const [name, box, colors, src, expect, tol] of EXAMPLES) {
  await check(`SPEC 6.2 ${name}`, async () => {
    const d = await rt.deploy(src, bench(box, colors));
    assert(d.ok, JSON.stringify(d));
    assert(d.oldResults && d.oldResults.length === 3, "旧コードのベンチ");
    const p = perOre(d.newResults);
    if (expect != null) near(p, expect, tol, "鑑定/鉱石");
    for (const r of d.newResults) assert(r.crates.every((c) => c.length <= box && c.every((id) => id >= 0)), "箱");
    if (name.includes("(9)")) assert(/^\{1 => \d+/.test(d.newResults[0].log) && d.newResults[0].log.includes("#<data Ore id=0"), d.newResults[0].log);
    if (name.includes("研磨")) assert(d.newResults[0].polished.length > 50, "polished");
    return `鑑定/鉱石 ${p.toFixed(3)}  ruby ${d.newResults.map((r) => r.ms.toFixed(1)).join("/")}ms`;
  });
}

await check("1 バッチの時間（研磨 + chunk_while、箱 9、3 色）", async () => {
  assert((await rt.deploy(PACK_POLISH + STRAIGHTS_CHUNK, bench(9, ["red", "blue", "green"]))).ok);
  const l = lit(makeBelt(9, ["red", "blue", "green"]), 9);
  const rts = [], rubys = [];
  for (let i = 0; i < 20; i++) {
    const t = performance.now();
    const r = await rt.batch(l);
    rts.push(performance.now() - t);
    rubys.push(r.ms);
    assert(r.ok);
  }
  const avg = (a) => a.reduce((x, y) => x + y) / a.length;
  measure("1 バッチ（Worker 内の Ruby）ms", avg(rubys), "研磨 + chunk_while 箱9 3色、20 回平均");
  measure("1 バッチ（往復）ms", avg(rts));
});

// ---- 付録 A 末尾の表 ----
await check("rescue => e で囲んでも Overheat（ops 200001）", async () => {
  const d = await rt.deploy("def pack(belt)\n  loop { belt.sum(&:carat) }\nrescue => e\n  [[belt.first]]\nend\n", bench(3, ["red"]));
  assert(!d.ok && d.stage === "bench" && d.errClass === "Yield::Overheat", JSON.stringify(d));
  return d.message;
});
await check("ZeroDivisionError、行 2（デプロイは拒否、本番は前のコード）", async () => {
  const d = await rt.deploy("def pack(belt)\n  belt.each_slice(box).map { it.sum(&:carat) / 0 }\nend\n", bench(3, ["red"]));
  assert(!d.ok && d.stage === "bench" && d.errClass === "ZeroDivisionError" && d.line === 2, JSON.stringify(d));
  const r = await rt.batch(lit(makeBelt(4, ["red", "blue", "green"]), 9));
  assert(r.ok && r.polished.length > 0, "本番は研磨のコードのまま");
});
await check("閉じ括弧不足は compile 段階の SyntaxError（行つき）", async () => {
  const d = await rt.deploy("def pack(belt)\n  belt.each_slice(box.to_a\nend\n", bench(3, ["red"]));
  assert(!d.ok && d.stage === "compile" && d.errClass === "SyntaxError" && d.line >= 1, JSON.stringify(d));
  return d.message.split("\n").slice(0, 2).join(" / ");
});
await check("def packk", async () => {
  const d = await rt.deploy("def packk(belt)\n  belt.each_slice(box).to_a\nend\n", bench(3, ["red"]));
  assert(!d.ok && d.stage === "compile" && d.message === "def pack(belt) が見つかりません", JSON.stringify(d));
});
await check("each_slice(box) { } は全部 -1", async () => {
  const d = await rt.deploy("def pack(belt)\n  belt.each_slice(box) { }\nend\n", bench(3, ["red"]));
  assert(d.ok && d.newResults[0].crates.length === 512 && d.newResults[0].crates.every((c) => c.length === 1 && c[0] === -1));
});
await check("[[1, 2, 3], belt.first(2)] は [[-1,-1,-1],[0,1]]", async () => {
  const d = await rt.deploy("def pack(belt) = [[1, 2, 3], belt.first(2)]", bench(3, ["red"]));
  assert(d.ok && JSON.stringify(d.newResults[0].crates) === "[[-1,-1,-1],[0,1]]", JSON.stringify(d.newResults[0].crates));
});
await check("不正な戻り値（42）はベンチで TypeError、デプロイしない", async () => {
  const d = await rt.deploy("def pack(belt) = 42", bench(3, ["red"]));
  assert(!d.ok && d.stage === "bench" && d.errClass === "TypeError", JSON.stringify(d));
});
await check("Yield.tick の再定義は鑑定 0、monkeyPatched。次のデプロイには残らない", async () => {
  const d = await rt.deploy("Yield.define_singleton_method(:tick) { |n = 1| }\ndef pack(belt) = belt.reject(&:flaw).each_slice(box).to_a\n", bench(3, ["red"]));
  assert(d.ok && d.newResults.every((r) => r.ops === 0 && r.monkeyPatched === true), JSON.stringify(d.newResults[0]).slice(0, 200));
  const d2 = await rt.deploy("def pack(belt) = belt.reject(&:flaw).each_slice(box).to_a\n", bench(3, ["red"]));
  assert(d2.ok && d2.newResults.every((r) => r.ops === 512 && r.monkeyPatched === false));
  assert(d2.oldResults.every((r) => r.monkeyPatched === true), "旧 VM はパッチ済み");
});
await check("with(id: 0) の抜け道は鑑定 9 前後", async () => {
  const d = await rt.deploy("def pack(belt)\n  belt.group_by { it.with(id: 0) }\n      .sort_by { |key, _| [key.color, key.carat] }\n      .reject { |key, _| key.flaw }\n      .flat_map { |_, ores| ores.each_slice(box).to_a }\nend\n", bench(3, ["red", "blue"]));
  assert(d.ok);
  const p = perOre(d.newResults);
  assert(p > 7 && p < 11, String(p));
  return `鑑定/鉱石 ${p.toFixed(2)}`;
});
await check("== で 9 通りと比べる抜け道は鑑定 22 前後", async () => {
  const d = await rt.deploy("PROBES = %i[red].product((1..9).to_a, [false])\ndef pack(belt)\n  belt.group_by { |o| PROBES.find { |c, k, f| o == Ore.new(id: o.id, color: c, carat: k, flaw: f) } }\n      .reject { |key, _| key.nil? }.flat_map { |_, ores| ores.each_slice(box).to_a }\nend\n", bench(3, ["red", "blue"]));
  assert(d.ok);
  const p = perOre(d.newResults);
  near(p, 22.58, 2, "鑑定/鉱石");
  return `鑑定/鉱石 ${p.toFixed(2)}`;
});
await check("probe: Ractor / YJIT は本物のエラー文", async () => {
  const a = await rt.probe("Ractor.new {}");
  const b = await rt.probe("RubyVM::YJIT");
  assert(!a.ok && a.errClass === "NotImplementedError" && a.message === "new() function is unimplemented on this machine", JSON.stringify(a));
  assert(!b.ok && b.errClass === "NameError" && b.message === "uninitialized constant RubyVM::YJIT", JSON.stringify(b));
  return `${a.errClass}: ${a.message} / ${b.errClass}: ${b.message}`;
});

// ---- 暴走 ----
// 本番は GOOD に戻しておき、復帰後も GOOD で回ることを確かめる
async function resetGood() {
  const d = await rt.deploy(GOOD, bench(3, ["red"]));
  assert(d.ok, "GOOD に戻せない " + JSON.stringify(d));
}
const goodBatch = async () => {
  const r = await rt.batch(lit(makeBelt(5), 3));
  assert(r.ok && r.crates.length === 171 && r.ops === 0, "本番が GOOD で回る " + JSON.stringify(r).slice(0, 200));
};

const HANGS = [
  ["loop {}", "loop {}"],
  ["while true; end", "while true; end"],
  ["rescue Exception で retry", "begin\n    belt.sum(&:carat) while true\n  rescue Exception\n    retry\n  end"],
];
for (const [name, body] of HANGS) {
  await check(`デプロイ: ${name} は 5 秒で打ち切り、その間も batch は即返る`, async () => {
    await resetGood();
    const restarts = rt.restarts;
    const t = performance.now();
    const dp = rt.deploy(`def pack(belt)\n  ${body}\n  belt.each_slice(box).to_a\nend\n`, bench(3, ["red"]));
    await new Promise((r) => setTimeout(r, 300));
    const tb = performance.now();
    await goodBatch();
    const batchMs = performance.now() - tb;
    const d = await dp;
    const ms = performance.now() - t;
    assert(!d.ok && d.stage === "timeout" && d.errClass === "TimeoutError", JSON.stringify(d));
    assert(ms < 5600, `${ms}ms`);
    assert(batchMs < 200, `デプロイ中の batch ${batchMs}ms`);
    assert(rt.restarts === restarts + 1, "restarts");
    await goodBatch();
    measure(`デプロイ ${name} の打ち切り ms`, ms, `デプロイ中の batch ${batchMs.toFixed(1)}ms`);
  });
  await check(`batch: ${name}（箱 9 のときだけ）は 2 秒で打ち切り、作り直して前のコードで再開`, async () => {
    await resetGood();
    const gated = `def pack(belt)\n  if box == 9\n  ${body}\n  end\n  belt.each_slice(box).to_a\nend\n`;
    const d = await rt.deploy(gated, bench(3, ["red"]));
    assert(d.ok, "箱 3 のベンチは通る");
    const restarts = rt.restarts;
    const statuses = statusLog.length;
    const t = performance.now();
    const r = await rt.batch(lit(makeBelt(7), 9));
    const ms = performance.now() - t;
    assert(!r.ok && r.errClass === "TimeoutError" && r.restarted, JSON.stringify(r));
    assert(r.message === "pack が 2.0 秒以内に戻りませんでした（無限ループ?）", r.message);
    assert(ms < 2600, `${ms}ms`);
    assert(rt.restarts === restarts + 1);
    const phases = statusLog.slice(statuses).map((s) => s.phase).join(",");
    assert(phases === "restart,ready", phases);
    const ok = await rt.batch(lit(makeBelt(7), 3));
    assert(ok.ok && ok.crates.length === 171, "前のコード（このコード）で再開");
    measure(`batch ${name} の復帰 ms`, ms, `うち作り直し ${rt.timings.lastRestart.toFixed(1)}ms`);
  });
}

await check("深い再帰（デプロイ）: 拒否され、本番は無事", async () => {
  await resetGood();
  const d = await rt.deploy("def f(n) = f(n + 1)\ndef pack(belt) = f(0)\n", bench(3, ["red"]));
  assert(!d.ok, JSON.stringify(d));
  await goodBatch();
  return `${d.stage} ${d.errClass}: ${String(d.message).slice(0, 120)}`;
});
await check("深い再帰（batch）: 返ってきて、その後も回る", async () => {
  await resetGood();
  assert((await rt.deploy("def f(n) = f(n + 1)\ndef pack(belt)\n  f(0) if box == 9\n  belt.each_slice(box).to_a\nend\n", bench(3, ["red"]))).ok);
  const t = performance.now();
  const r = await rt.batch(lit(makeBelt(7), 9));
  const ms = performance.now() - t;
  assert(!r.ok, JSON.stringify(r));
  const ok = await rt.batch(lit(makeBelt(7), 3));
  assert(ok.ok);
  measure("batch 深い再帰 ms", ms, `${r.errClass}${r.restarted ? "（作り直し）" : ""}`);
  return `${r.errClass}: ${String(r.message).slice(0, 100)} restarted=${!!r.restarted}`;
});
await check("Array.new(10**9) は ArgumentError", async () => {
  const d = await rt.deploy("def pack(belt) = Array.new(10**9)", bench(3, ["red"]));
  assert(!d.ok && d.stage === "bench" && d.errClass === "ArgumentError", JSON.stringify(d));
});
for (const [name, body] of [["Array.new(4 * 10**8)", "Array.new(4 * 10**8)"], ["'x' * 10**6 を溜め続ける", "a = []\n    loop { a << 'x' * 10**6 }"]]) {
  await check(`メモリ爆弾（デプロイ）: ${name} は拒否`, async () => {
    await resetGood();
    const t = performance.now();
    const d = await rt.deploy(`def pack(belt)\n  ${body}\nend\n`, bench(3, ["red"]));
    assert(!d.ok && d.errClass === "NoMemoryError", JSON.stringify(d));
    await goodBatch();
    measure(`デプロイ メモリ爆弾 ${name} ms`, performance.now() - t);
  });
  await check(`メモリ爆弾（batch）: ${name} は NoMemoryError、次の batch の前に VM を作り直してメモリを返す`, async () => {
    await resetGood();
    assert((await rt.deploy(`def pack(belt)\n  if box == 9\n    ${body}\n  end\n  belt.each_slice(box).to_a\nend\n`, bench(3, ["red"]))).ok);
    const before = rt.prod;
    const t = performance.now();
    const r = await rt.batch(lit(makeBelt(7), 9));
    const ms = performance.now() - t;
    assert(!r.ok && r.errClass === "NoMemoryError", JSON.stringify(r));
    const grownMb = before.mem / 2 ** 20;
    const ok = await rt.batch(lit(makeBelt(7), 3));
    assert(ok.ok, "次も回る");
    assert(rt.prod !== before && rt.prod.mem < before.mem, "作り直してメモリが戻る");
    measure(`batch メモリ爆弾 ${name}`, ms, `VM のメモリ ${grownMb.toFixed(0)}MB → 作り直し後 ${(rt.prod.mem / 2 ** 20).toFixed(0)}MB`);
  });
}
await check("exit! は VM ごと落ちるが、作り直して前のコードで再開", async () => {
  await resetGood();
  const d = await rt.deploy("def pack(belt)\n  exit!\nend\n", bench(3, ["red"]));
  assert(!d.ok, JSON.stringify(d));
  await goodBatch();
  assert((await rt.deploy("def pack(belt)\n  exit! if box == 9\n  belt.each_slice(box).to_a\nend\n", bench(3, ["red"]))).ok);
  const r = await rt.batch(lit(makeBelt(7), 9));
  assert(!r.ok, JSON.stringify(r));
  const ok = await rt.batch(lit(makeBelt(7), 3));
  assert(ok.ok);
  return `deploy: ${d.stage} ${d.errClass} / batch: ${r.errClass} restarted=${!!r.restarted} ${String(r.message).slice(0, 80)}`;
});
await check("Worker の onerror（Worker 内の非同期例外）も同じ経路で復帰", async () => {
  await resetGood();
  const src = "def pack(belt)\n  if box == 9\n    require 'js'\n    JS.eval(\"setTimeout(() => { throw new Error('boom') }, 0)\")\n  end\n  belt.each_slice(box).to_a\nend\n";
  const d = await rt.deploy(src, bench(3, ["red"]));
  assert(d.ok, JSON.stringify(d));
  const restarts = rt.restarts;
  const r = await rt.batch(lit(makeBelt(7), 9));
  await new Promise((res) => setTimeout(res, 100));
  assert(rt.prod.dead, "onerror で Worker が死んだ扱いになる");
  const ok = await rt.batch(lit(makeBelt(7), 3));
  assert(ok.ok, JSON.stringify(ok));
  assert(rt.restarts === restarts + 1);
  return `onerror 前の batch ok=${r.ok}`;
});
await check("最後に本番が GOOD で回る", async () => {
  await resetGood();
  await goodBatch();
  return `restarts=${rt.restarts}`;
});

}

async function memCheck() {
measure("restarts", rt.restarts);
if (performance.memory) measure("メインスレッド JS ヒープ MB（Worker の wasm は含まない）", performance.memory.usedJSHeapSize / 2 ** 20);

// 2 VM 同時保持の参考値: 外部（Playwright）が __memPoint を見て ps で RSS を取る
async function memPoint(name, ms = 1500) {
  window.__memPoint = name;
  await new Promise((r) => setTimeout(r, ms));
}
await check("VM 2 つ同時（デプロイ中）のメモリ", async () => {
  assert((await rt.deploy(GOOD, bench(3, ["red"]))).ok);
  await memPoint("1vm");
  const dp = rt.deploy("def pack(belt)\n  loop {}\nend\n", bench(3, ["red"]));
  await new Promise((r) => setTimeout(r, 1000));
  await memPoint("2vm");
  await dp;
  await memPoint("after");
  window.__memPoint = null;
});

}

function finish() {
const failed = results.filter((r) => !r.ok);
$("summary").textContent = `${results.length - failed.length} / ${results.length} OK`;
$("status").textContent = "完了";
window.__done = true;
}
</script>
